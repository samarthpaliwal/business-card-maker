<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Business Card Maker</title><style>*{box-sizing:border-box;margin:0;padding:0}body,html{height:100%}body{display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#f5f5f5}.container{width:90%;max-width:500px;padding:2rem;background:#fff;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.1)}.step{display:none;opacity:0;animation:slideDown .4s ease-out forwards}@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}button,input{font-size:1rem;margin-top:1rem}input{width:100%;padding:.6rem;border:1px solid #ccc;border-radius:4px}button{padding:.75rem 1.5rem;border:none;border-radius:4px;background:#007bff;color:#fff;cursor:pointer;transition:background .2s}button:disabled{background:#ccc;cursor:default}button:not(:disabled):hover{background:#0056b3}#color-options{display:flex;gap:.75rem;justify-content:center;margin:1rem 0}.color-btn{width:2rem;height:2rem;border:none;border-radius:50%;cursor:pointer;transition:transform .1s}.color-btn:hover{transform:scale(1.2)}#logo-preview img{max-width:100px;margin-top:1rem}#timer{font-size:3rem;text-align:center;margin:1rem 0}#progress{width:100%;height:8px;background:#eee;border-radius:4px;overflow:hidden}#progress-bar{width:0;height:100%;background:#007bff;transition:width .1s linear}.business-card{margin:2rem auto;padding:2rem;background:var(--card-bg,#fff);color:var(--card-text,#222);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.1);text-align:center;font-family:Arial,sans-serif}.business-card img.logo{max-height:60px;margin-bottom:1rem}.business-card h2{font-family:'Playfair Display',serif;margin:0 0 .5rem}.business-card p{margin:.3rem 0}.button-group{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}</style><script defer="defer" src="/business-card-maker/static/js/main.10aaa2d2.js"></script><link href="/business-card-maker/static/css/main.bf2e195e.css" rel="stylesheet"></head><body><div class="container"><div id="step1" class="step"><h2>Step 1: Enter your info</h2><input id="inp-name" placeholder="Name"/> <input id="inp-title" placeholder="Title" style="margin-top:.75rem"/> <input id="inp-company" placeholder="Company" style="margin-top:.75rem"/> <input id="inp-email" type="email" placeholder="Email" style="margin-top:.75rem"/> <input id="inp-phone" type="tel" placeholder="Phone" style="margin-top:.75rem"/> <button id="next1">Next</button></div><div id="step2" class="step"><h2>Step 2: Pick your card color</h2><div id="color-options"><button class="color-btn" data-color="#ffffff" style="background:#fff;border:1px solid #ccc"></button> <button class="color-btn" data-color="#f7f1e1" style="background:#f7f1e1"></button> <button class="color-btn" data-color="#d4af37" style="background:#d4af37"></button> <button class="color-btn" data-color="#000" style="background:#000"></button></div><button id="next2" disabled="disabled">Next</button></div><div id="step3" class="step"><h2>Step 3: Upload your logo</h2><input type="file" id="logo-input" accept="image/png,image/jpeg"/><div id="logo-preview"></div><button id="next3" disabled="disabled">Next</button></div><div id="step4" class="step"><h2>Step 4: Finalizing…</h2><div id="timer">10</div><div id="progress"><div id="progress-bar"></div></div></div><div id="step5" class="step"><h2>Your Business Card</h2><div id="card-container"></div><div class="button-group"><button id="edit-info">Edit Info</button> <button id="edit-color">Edit Color</button> <button id="edit-logo">Edit Logo</button> <button id="download-pdf">Download PDF</button></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>const info={name:"",title:"",company:"",email:"",phone:"",color:"#fff",logoUrl:""};function show(e){for(let n=1;n<=5;n++){const t=document.getElementById("step"+n);t.style.display=n===e?"block":"none",n===e&&t.classList.add("slide")}}function luma(e){const[n,t,o]=e.replace("#","").match(/.{2}/g).map(e=>parseInt(e,16));return.2126*n+.7152*t+.0722*o}document.getElementById("next1").onclick=()=>{["name","title","company","email","phone"].forEach(e=>{info[e]=document.getElementById("inp-"+e).value.trim()}),show(2)},document.querySelectorAll(".color-btn").forEach(e=>{e.onclick=()=>{info.color=e.dataset.color,document.getElementById("next2").disabled=!1}}),document.getElementById("next2").onclick=()=>show(3);const logoIn=document.getElementById("logo-input"),logoPrev=document.getElementById("logo-preview"),next3=document.getElementById("next3");logoIn.onchange=()=>{const e=logoIn.files[0];if(!e)return;if(!["image/png","image/jpeg"].includes(e.type))return alert("Only PNG/JPG allowed"),void(logoIn.value="");const n=new FileReader;n.onload=()=>{info.logoUrl=n.result,logoPrev.innerHTML=`<img src="${info.logoUrl}" style="max-height:80px;">`,next3.disabled=!1},n.readAsDataURL(e)},next3.onclick=()=>show(4);const timerEl=document.getElementById("timer"),progress=document.getElementById("progress-bar");function buildCard(){document.getElementById("card-container").innerHTML=`\n        <div class="business-card" style="--card-bg:${info.color};--card-text:${luma(info.color)>180?"#333":"#fff"}">\n          ${info.logoUrl?`<img src="${info.logoUrl}" class="logo">`:""}\n          <h2>${info.name}</h2>\n          <p><strong>${info.title}</strong></p>\n          <p>${info.company}</p>\n          <p>${info.email}</p>\n          <p>${info.phone}</p>\n        </div>`}document.getElementById("step4").addEventListener("animationend",()=>{let e=10;timerEl.textContent=e,progress.style.width="0%";const n=setInterval(()=>{e--,timerEl.textContent=e,progress.style.width=(10-e)/10*100+"%",e<=0&&(clearInterval(n),buildCard(),show(5))},1e3)}),document.getEleme
