<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Business Card Maker</title><style>.step{display:none;opacity:0;animation:slideDown .4s ease-out forwards}button,input{font-size:1rem;margin-top:1rem}input{padding:.6rem;width:100%;max-width:300px;border:1px solid #ccc;border-radius:4px}button{padding:.75rem 1.5rem;border:none;border-radius:4px;background:#007bff;color:#fff;cursor:pointer;transition:background .2s}button:disabled{background:#ccc;cursor:default}button:not(:disabled):hover{background:#0056b3}.business-card{width:350px;padding:1.5rem;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.1);background:#fff;margin:2rem auto;font-family:Arial,sans-serif;text-align:center}.business-card .logo{max-height:50px;margin-bottom:1rem}.business-card h2{margin:0 0 .5rem;font-family:'Playfair Display',serif;font-size:1.6rem;color:#222}.business-card p{margin:.3rem 0;color:#555}</style><script defer="defer" src="/business-card-maker/static/js/main.10aaa2d2.js"></script><link href="/business-card-maker/static/css/main.bf2e195e.css" rel="stylesheet"></head><body><div class="container"><div id="step1" class="step"><h2>Step 1: Your name?</h2><input id="name" placeholder="Your Name"/><br/><button id="next1" disabled="disabled">Next</button></div><div id="step2" class="step"><h2>Step 2: Your title?</h2><input id="title" placeholder="Your Title"/><br/><button id="next2" disabled="disabled">Next</button></div><div id="step3" class="step"><h2>Step 3: Company?</h2><input id="company" placeholder="Your Company"/><br/><button id="next3" disabled="disabled">Next</button></div><div id="step4" class="step"><h2>Step 4: Email?</h2><input type="email" id="email" placeholder="you@example.com"/><br/><button id="next4" disabled="disabled">Next</button></div><div id="step5" class="step"><h2>Step 5: Phone?</h2><input type="tel" id="phone" placeholder="(555) 123-4567"/><br/><button id="next5" disabled="disabled">Next</button></div><div id="step6" class="step"><h2>Your Business Card</h2><div id="card-container"></div></div></div><script>function show(e){for(let n=1;n<=6;n++){const t=document.getElementById("step"+n);t.style.display=n===e?"block":"none",n===e&&t.classList.add("slide")}}function wire(e,n,t){const o=document.getElementById(n),l=document.getElementById(t);o.addEventListener("input",()=>l.disabled=!o.value.trim())}wire(1,"name","next1"),wire(2,"title","next2"),wire(3,"company","next3"),wire(4,"email","next4"),wire(5,"phone","next5"),document.getElementById("next1").onclick=()=>show(2),document.getElementById("next2").onclick=()=>show(3),document.getElementById("next3").onclick=()=>show(4),document.getElementById("next4").onclick=()=>show(5),document.getElementById("next5").onclick=()=>{const e=document.getElementById("name").value,n=document.getElementById("title").value,t=document.getElementById("company").value,o=document.getElementById("email").value,l=document.getElementById("phone").value;document.getElementById("card-container").innerHTML=`\n        <div class="business-card">\n          \x3c!-- optional logo img here: <img src="…" class="logo" /> --\x3e\n          <h2>${e}</h2>\n          <p><strong>${n}</strong></p>\n          <p>${t}</p>\n          <p>${o}</p>\n          <p>${l}</p>\n        </div>`,show(6)},show(1)</script></body></html>
